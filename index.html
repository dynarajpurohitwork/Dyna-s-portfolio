<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dyna Rajpurohit - marketer. A flip-through marketing diary: how I think, NPrep, NEWME, case studies, swipe file and midnight notes.">
<meta property="og:title" content="Dyna's Marketing Diary">
<meta property="og:description" content="A marketer's portfolio you can flip through.">
<meta property="og:image" content="https://dynarajpurohitwork.github.io/Dyna-s-portfolio/img/latte.jpg">
<meta name="theme-color" content="#2a201b">
<link rel="icon" type="image/png" href="img/dyna.png">
<style>html,body{margin:0} img{max-width:100%} [hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Dyna's Marketing Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Courier+Prime:wght@400;700&family=Nanum+Pen+Script&family=Press+Start+2P&display=swap">
<style>
/* Layout: a ring binder lying open on a cafe table; divider tabs on top, one idea per page, flip to turn. Single committed look (desk at night), so no theme switch. */
:root{
  --desk:#2a201b; --desk-hi:#4a3729;
  --leather:#151313; --paper:#fbf8f1; --dot:#ddd5c8;
  --ink:#1c1918; --ink-soft:#615954; --line:#cfc6b8;
  --pink:#ff5fa2; --pink-soft:#ffd6e8; --mango:#ffb547; --mango-soft:#ffe6b8;
  --teal:#3cc7c4; --teal-soft:#c9f0ee; --gold:#c9a24a; --gold-hi:#f3dc93;
  --f-head:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-hand:"Nanum Pen Script", "Comic Sans MS", cursive;
  --f-type:"Courier Prime", "Courier New", monospace;
  --f-px:"Press Start 2P", "Courier New", monospace; --night:#1e1b2c;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{background:var(--desk)}
body{
  color:var(--ink); font-family:var(--f-head); font-size:15px; line-height:1.45;
  background:radial-gradient(120% 70% at 50% -10%, var(--desk-hi), var(--desk) 62%);
  min-height:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 40px;
}
.wrap{max-width:1180px; margin:0 auto}
.deskline{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; color:#efe4d6; margin-bottom:14px}
.deskline .me{font-family:var(--f-hand); font-size:34px; line-height:1}
.deskline .me b{color:var(--pink); font-weight:400}
.deskline .tip{font-family:var(--f-type); font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.7}

/* divider tabs */
.tabs{display:flex; gap:6px; padding-left:28px; overflow-x:auto; scrollbar-width:none; position:relative; z-index:1}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto; border:0; cursor:pointer; font-family:var(--f-type); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  padding:9px 16px 14px; border-radius:10px 10px 0 0; margin-bottom:-6px; color:var(--ink); transition:transform .2s; transform:translateY(4px)}
.tab:hover,.tab[aria-current="true"]{transform:translateY(0)}
.tab:focus-visible{outline:2px solid var(--gold-hi); outline-offset:2px}
.tab[data-c="pink"]{background:var(--pink)} .tab[data-c="mango"]{background:var(--mango)} .tab[data-c="teal"]{background:var(--teal)}
.tab[data-c="paper"]{background:var(--paper)} .tab[data-c="soft"]{background:var(--pink-soft)} .tab[data-c="gold"]{background:var(--gold-hi)}

/* binder */
.book{position:relative; background:var(--leather); border-radius:18px; padding:14px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.04)}
.pages{position:relative; display:grid; grid-template-columns:1fr 1fr; perspective:2600px; min-height:680px}
.slot{position:relative; display:flex; min-width:0}
.pg{position:relative; flex:1; min-width:0; background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.4px); background-size:20px 20px; background-position:10px 10px;
  padding:46px 48px 52px; overflow:hidden}
.slot-l .pg, .face-l{border-radius:8px 2px 2px 8px; box-shadow:inset -18px 0 24px -18px rgba(0,0,0,.25)}
.slot-r .pg, .face-r{border-radius:2px 8px 8px 2px; box-shadow:inset 18px 0 24px -18px rgba(0,0,0,.25)}
.rings{position:absolute; left:50%; top:4%; bottom:4%; width:44px; transform:translateX(-50%); display:flex; flex-direction:column; justify-content:space-around; z-index:5; pointer-events:none}
.ring{height:20px; border-radius:12px; background:linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, #8b6a24 80%, var(--gold-hi));
  box-shadow:0 3px 4px rgba(0,0,0,.35)}
.pnum{position:absolute; bottom:18px; font-family:var(--f-type); font-size:11px; color:var(--ink-soft); letter-spacing:.1em}
.slot-l .pnum,.face-l .pnum{left:48px} .slot-r .pnum,.face-r .pnum{right:48px}

/* page turn */
.flap{position:absolute; top:0; bottom:0; width:50%; transform-style:preserve-3d; z-index:4}
.flap.fwd{left:50%; transform-origin:left center; animation:fwd .75s cubic-bezier(.45,.05,.25,1) forwards}
.flap.back{left:0; transform-origin:right center; animation:bwd .75s cubic-bezier(.45,.05,.25,1) forwards}
.flap .face{position:absolute; inset:0; display:flex; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.flap .face > .pg{flex:1}
.flap .face.under{transform:rotateY(180deg)}
.flap::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg, rgba(0,0,0,.18), transparent 40%); opacity:0; animation:shade .75s forwards}
@keyframes fwd{to{transform:rotateY(-180deg)}}
@keyframes bwd{to{transform:rotateY(180deg)}}
@keyframes shade{50%{opacity:1}100%{opacity:0}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.2; transform:translateY(6px)}to{opacity:1; transform:none}}

/* nav */
.nav{display:flex; justify-content:center; align-items:center; gap:18px; margin-top:18px; color:#efe4d6}
.nav button{font-family:var(--f-type); font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; border:1.5px solid #efe4d6; background:transparent; color:#efe4d6; padding:10px 18px; border-radius:999px; cursor:pointer}
.nav button:hover:not(:disabled){background:#efe4d6; color:var(--desk)}
.nav button:disabled{opacity:.3; cursor:default}
.nav button:focus-visible{outline:2px solid var(--pink); outline-offset:3px}
.nav .count{font-family:var(--f-type); font-size:13px; min-width:110px; text-align:center; font-variant-numeric:tabular-nums}

/* type */
.eyebrow{font-family:var(--f-type); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 14px}
h1,h2,h3{margin:0; text-wrap:balance}
.h1{font-family:var(--f-hand); font-weight:400; font-size:clamp(64px,7.4vw,96px); line-height:.85; letter-spacing:-.01em}
.h2{font-family:var(--f-head); font-weight:800; font-size:clamp(28px,3.1vw,42px); line-height:1.02; letter-spacing:-.025em}
.h3{font-family:var(--f-head); font-weight:800; font-size:19px; line-height:1.1; letter-spacing:-.01em}
.hand{font-family:var(--f-hand); font-size:27px; line-height:1.05; color:var(--ink)}
.hand.sm{font-size:23px}
.soft{color:var(--ink-soft)}
.hl,.hl-m{background-image:linear-gradient(var(--pink-soft),var(--pink-soft)); background-repeat:no-repeat; background-size:100% 34%; background-position:0 88%; padding:0 .08em}
.hl-m{background-image:linear-gradient(var(--mango-soft),var(--mango-soft))}
.stack{display:flex; flex-direction:column; gap:18px}
.row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start}

/* paper objects */
.sticky{position:relative; padding:14px 16px 16px; box-shadow:0 8px 14px -8px rgba(40,25,10,.45); font-size:14px; line-height:1.3}
.sticky.pink{background:var(--pink-soft)} .sticky.mango{background:var(--mango-soft)} .sticky.teal{background:var(--teal-soft)} .sticky.white{background:#fff}
.sticky b{display:block; font-family:var(--f-head); font-weight:800; font-size:24px; letter-spacing:-.02em; line-height:1; margin-bottom:4px}
.tilt-l{transform:rotate(-2.2deg)} .tilt-r{transform:rotate(1.8deg)} .tilt-ll{transform:rotate(-4deg)} .tilt-rr{transform:rotate(3.5deg)}
.tape::before{content:""; position:absolute; top:-10px; left:50%; width:64px; height:20px; transform:translateX(-50%) rotate(-3deg); background:rgba(60,199,196,.55); mix-blend-mode:multiply}
.tape.pk::before{background:rgba(255,95,162,.45)}
.polaroid{background:#fff; padding:9px 9px 34px; box-shadow:0 10px 18px -8px rgba(40,25,10,.5); position:relative; width:150px}
.polaroid img{display:block; width:100%; aspect-ratio:1; object-fit:cover}
.polaroid figcaption{position:absolute; left:0; right:0; bottom:6px; text-align:center; font-family:var(--f-hand); font-size:20px}
.slotph{display:grid; place-items:center; aspect-ratio:1; border:2px dashed var(--line); font-family:var(--f-type); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); text-align:center; padding:8px}
.film{background:#141212; padding:10px 14px; display:flex; flex-direction:column; gap:8px; width:118px; position:relative;
  background-image:radial-gradient(circle at 5px 50%, var(--paper) 2.6px, transparent 3px), radial-gradient(circle at calc(100% - 5px) 50%, var(--paper) 2.6px, transparent 3px);
  background-size:100% 14px; background-repeat:repeat-y; box-shadow:0 10px 18px -8px rgba(0,0,0,.5)}
.film img{width:100%; aspect-ratio:1; object-fit:cover; filter:grayscale(1) contrast(1.1); display:block}
.stamp{display:inline-block; font-family:var(--f-type); font-weight:700; text-transform:uppercase; letter-spacing:.1em; font-size:13px; color:var(--pink);
  border:2.5px double var(--pink); padding:8px 12px; border-radius:4px; transform:rotate(-6deg)}
.chip{display:inline-block; font-family:var(--f-type); font-size:12px; font-weight:700; letter-spacing:.06em; padding:6px 11px; border-radius:999px; border:1.5px solid var(--ink); background:var(--paper)}
.chip.fill{background:var(--ink); color:var(--paper)}
.abs{position:absolute}
.stk{width:46px; height:46px; display:block}
svg text{font-family:var(--f-head)}
.note-arrow{display:flex; align-items:center; gap:8px}

/* specific blocks */
.timeline{list-style:none; margin:0; padding:0; position:relative; display:flex; flex-direction:column; gap:16px}
.timeline::before{content:""; position:absolute; left:15px; top:10px; bottom:10px; border-left:2px dashed var(--ink)}
.timeline li{display:grid; grid-template-columns:32px 1fr; gap:14px; align-items:start; position:relative}
.timeline .dot{width:32px; height:32px; border-radius:50%; border:2px solid var(--ink); background:var(--paper); display:grid; place-items:center; font-family:var(--f-type); font-size:11px; font-weight:700}
.timeline li:last-child .dot{background:var(--pink); border-color:var(--pink)}
.timeline .yr{font-family:var(--f-type); font-size:12px; color:var(--ink-soft); letter-spacing:.08em}
.flow{display:flex; flex-direction:column; gap:0}
.flow .step{display:grid; grid-template-columns:54px 1fr; gap:14px; align-items:center}
.flow .ic{width:54px; height:54px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--ink); background:var(--paper)}
.flow .ic svg{width:26px; height:26px}
.flow .down{height:22px; margin-left:26px; border-left:2px solid var(--ink)}
.brand-block{background:var(--pink); padding:26px 24px 22px; position:relative}
.wordmark{font-family:var(--f-head); font-weight:800; font-size:clamp(58px,7vw,92px); letter-spacing:-.05em; line-height:.8; color:var(--ink)}
.weeks{display:grid; grid-template-columns:repeat(13,1fr); gap:5px; max-width:340px}
.weeks span{aspect-ratio:1; border:1.5px solid var(--ink); border-radius:3px}
.weeks span.on{background:var(--ink)}
.idcard{background:#fff; border:2px solid var(--ink); border-radius:12px; padding:18px; display:grid; grid-template-columns:110px 1fr; gap:16px; box-shadow:6px 6px 0 var(--ink); max-width:420px}
.idcard dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px}
.idcard dt{font-family:var(--f-type); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); padding-top:2px}
.idcard dd{margin:0; font-weight:600}
.bubbles{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px}
.bub{font-family:var(--f-hand); font-size:24px; line-height:1; padding:10px 14px; border-radius:18px 18px 18px 4px; border:2px solid var(--ink); background:#fff}
.bub:nth-child(2n){border-radius:18px 18px 4px 18px; background:var(--mango-soft)}
.dm{border-radius:16px; padding:14px 16px; font-size:15px; line-height:1.35; max-width:330px; position:relative}
.dm.a{background:#eee8e0; color:var(--ink-soft)}
.dm.b{background:var(--ink); color:var(--paper)}
.dm .who{display:block; font-family:var(--f-type); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; opacity:.7}
.strike{position:absolute; inset:0; pointer-events:none}
.belief{border:2px solid var(--ink); padding:20px 22px; background:var(--paper); position:relative}
.belief p{margin:0; font-family:var(--f-head); font-weight:800; font-size:21px; line-height:1.15; letter-spacing:-.015em}
.funnel{display:grid; grid-template-columns:minmax(0,1fr); gap:8px}
.band{display:grid; grid-template-columns:1fr; gap:8px}
.band .shape{height:66px; display:grid; place-items:center; font-family:var(--f-type); font-weight:700; text-transform:uppercase; letter-spacing:.14em; font-size:14px}
.band:nth-child(1) .shape{background:var(--pink); clip-path:polygon(0 0,100% 0,92% 100%,8% 100%)}
.band:nth-child(2) .shape{background:var(--mango); clip-path:polygon(8% 0,92% 0,84% 100%,16% 100%)}
.band:nth-child(3) .shape{background:var(--teal); clip-path:polygon(16% 0,84% 0,76% 100%,24% 100%)}
.band p{margin:0 0 8px; text-align:center; font-size:14px; color:var(--ink-soft)}
.loop{position:relative; width:100%; max-width:420px; aspect-ratio:1; margin:0 auto}
.loop svg{position:absolute; inset:0; width:100%; height:100%}
.loop .node{position:absolute; width:42%; text-align:center; transform:translate(-50%,-50%); background:var(--paper); padding:6px 4px; font-size:13.5px; line-height:1.2}
.loop .node b{display:block; font-weight:800; font-size:15px}
.loop .core{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-6deg); background:var(--pink); font-weight:800; letter-spacing:-.03em; font-size:22px; padding:6px 12px}
.chart{width:100%; max-width:440px; height:auto; display:block}
.looks{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center}
.look{border:2px solid var(--ink); border-radius:10px; padding:12px; background:#fff; text-align:center}
.look .ctx{font-family:var(--f-type); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft)}
.look .hook{font-family:var(--f-hand); font-size:24px; line-height:1; margin-top:6px}
.three{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.three .sticky{text-align:center; padding:16px 10px}
.three .sticky b{font-size:18px}
.contact{display:grid; gap:10px; font-size:16px}
.contact .k{font-family:var(--f-type); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft)}
.contact a{color:var(--ink); text-decoration-color:var(--pink); text-decoration-thickness:2px; text-underline-offset:3px; font-weight:600; word-break:break-word}
.copy{font-family:var(--f-type); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:1.5px solid var(--ink); background:transparent; padding:4px 9px; border-radius:999px; cursor:pointer; margin-left:8px; color:var(--ink)}
.copy:focus-visible{outline:2px solid var(--pink); outline-offset:2px}
.drivers{display:grid; grid-template-columns:1fr 1fr; gap:14px 12px}
.drivers .sticky b{font-size:26px}
.drivers .wide{grid-column:1/-1}
.src{font-family:var(--f-type); font-size:11px; color:var(--ink-soft); letter-spacing:.04em}


/* ---------- motion ---------- */
.wrap{position:relative; z-index:1}
.bokeh{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
.bokeh i{position:absolute; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,190,120,.16), transparent 65%); animation:drift 22s ease-in-out infinite alternate}
.bokeh i:nth-child(1){left:4%; top:10%} .bokeh i:nth-child(2){left:78%; top:4%; animation-duration:28s; background:radial-gradient(circle, rgba(255,95,162,.12), transparent 65%)}
.bokeh i:nth-child(3){left:60%; top:70%; animation-duration:25s} .bokeh i:nth-child(4){left:14%; top:76%; animation-duration:31s; background:radial-gradient(circle, rgba(60,199,196,.10), transparent 65%)}
.bokeh i:nth-child(5){left:40%; top:-6%; animation-duration:19s} .bokeh i:nth-child(6){left:84%; top:52%; animation-duration:27s}
@keyframes drift{to{translate:50px -40px; scale:1.25}}

.book{perspective:2400px}
.cover{position:absolute; inset:0; z-index:8; border:0; border-radius:18px; cursor:pointer; overflow:hidden; transform-origin:left center; padding:0;
  background-color:#1a1615;
  background-image:radial-gradient(circle at 28% 18%, rgba(255,255,255,.07), transparent 42%), radial-gradient(circle at 80% 90%, rgba(255,95,162,.07), transparent 40%),
    repeating-linear-gradient(35deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), inset 0 0 60px rgba(0,0,0,.6)}
.cover::before{content:""; position:absolute; inset:14px; border:2px dashed rgba(201,162,74,.45); border-radius:12px}
.cover .elastic{position:absolute; top:0; bottom:0; right:9%; width:22px; background:linear-gradient(90deg,#c9437c,var(--pink) 40%,#c9437c); box-shadow:0 0 12px rgba(0,0,0,.5)}
.cover .label{position:absolute; left:50%; top:50%; translate:-50% -50%; rotate:-2deg; background:var(--paper); padding:26px 34px 22px; display:grid; gap:10px; text-align:center; box-shadow:0 14px 26px -10px rgba(0,0,0,.7); width:min(78%,440px)}
.cover .label .hand{font-size:clamp(40px,5.4vw,66px); line-height:.9}
.cover .label .eyebrow{margin:0}
.cv{position:absolute}
.cover .spin{animation:spin 9s linear infinite}
.cover .beat{animation:beat 1.6s ease-in-out infinite}
.openme{left:50%; bottom:9%; translate:-50% 0; font-family:var(--f-type); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-hi); animation:blink 1.4s ease-in-out infinite}
.cover:focus-visible{outline:3px solid var(--gold-hi); outline-offset:-6px}
.cover.opening{animation:coverOpen 1.05s cubic-bezier(.55,.05,.3,1) forwards; pointer-events:none}
@keyframes coverOpen{40%{transform:rotateY(-35deg)} to{transform:rotateY(-150deg); opacity:0}}
@keyframes blink{50%{opacity:.35}}

.corner{position:absolute; bottom:14px; width:34px; height:34px; border:0; padding:0; cursor:pointer; z-index:6; transition:width .25s, height .25s; filter:drop-shadow(-2px -2px 3px rgba(0,0,0,.18))}
.corner.next{right:14px; background:linear-gradient(135deg, #ece3d3 0 50%, var(--leather) 50%); border-radius:0 0 8px 0}
.corner.prev{left:14px; background:linear-gradient(225deg, #ece3d3 0 50%, var(--leather) 50%); border-radius:0 0 0 8px; filter:drop-shadow(2px -2px 3px rgba(0,0,0,.18))}
.corner:hover,.corner:focus-visible{width:62px; height:62px; outline:none}
.corner[disabled]{display:none}

.snd{opacity:.75}
.snd[aria-pressed="true"]{opacity:1; border-color:var(--pink) !important; color:var(--pink) !important}

.tab:hover{animation:wig .45s ease}
@keyframes wig{30%{rotate:-3deg} 65%{rotate:2deg}}

.drag{cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none}
.drag.dragging{cursor:grabbing; z-index:30; scale:1.06; filter:drop-shadow(0 16px 14px rgba(40,25,10,.35))}
.drag img{pointer-events:none; -webkit-user-drag:none}

.pg.enter .eyebrow{animation:typeit .55s steps(22) var(--d,0s) backwards}
.pg.enter .h1,.pg.enter .h2{animation:rise .7s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}
.pg.enter .hand{animation:write 1s ease-out var(--d,0s) backwards}
.pg.enter .hl,.pg.enter .hl-m{animation:swipe .55s ease-out calc(var(--d,0s) + .45s) backwards}
.pg.enter .timeline li,.pg.enter .flow .step,.pg.enter .contact > div,.pg.enter ul li,.pg.enter .loop .node,.pg.enter .band,.pg.enter .chart text{animation:rise-sm .5s ease-out var(--d,0s) backwards}
.pg.enter .flow .down{animation:grow .35s ease-out var(--d,0s) backwards; transform-origin:top}
.pg.enter .timeline::before{animation:grow 1.1s ease-out .2s backwards; transform-origin:top}
.pg.enter .sticky,.pg.enter .polaroid,.pg.enter .film,.pg.enter .belief,.pg.enter .idcard,.pg.enter .dm,.pg.enter .look,.pg.enter .brand-block,.pg.enter .three > *{animation:drop .6s cubic-bezier(.2,.9,.3,1.2) var(--d,0s) backwards}

.steps8{list-style:none; counter-reset:st; margin:24px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:8px 26px}
.steps8 li{counter-increment:st; display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; padding:8px 12px; border:2px solid var(--ink); border-radius:10px; background:#fff; position:relative}

.stress .ping:nth-of-type(2){animation-delay:.6s} .stress .ping:nth-of-type(3){animation-delay:1.2s} .stress .ping:nth-of-type(4){animation-delay:1.8s}

.cal{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:24px; max-width:420px}
.cal span{border:2px solid var(--ink); border-top-width:8px; background:#fff; font-size:12px; font-weight:700; padding:10px 6px; text-align:center; min-height:62px; display:grid; place-items:center; line-height:1.15}

.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px}

.tile{border:2px solid var(--ink); background:#fff; padding:12px 12px 10px; box-shadow:4px 4px 0 var(--ink); display:flex; flex-direction:column; gap:4px; min-width:0}
.tile.pink{background:var(--pink-soft)}

.journey span.x{border-style:dashed; color:var(--ink-soft)}
.journey span.x::after{content:"!"; position:absolute; top:-10px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--pink); color:var(--ink); display:grid; place-items:center; font-size:12px; font-weight:800}
.journey i{font-style:normal; font-weight:800}
.plan{margin:0; padding-left:22px; display:grid; gap:6px; font-weight:600}
.meter{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px}
.meter div{border:2px solid var(--ink); padding:12px; background:#fff; display:grid; gap:4px}
.meter div:last-child{background:var(--mango-soft)}

.meter b{font-size:16px}
.msg-swap{display:grid; gap:10px; margin-top:6px}
.msg-swap span{font-family:var(--f-head); font-weight:800; font-size:clamp(22px,2.6vw,32px); letter-spacing:-.02em}
.msg-swap .old{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--pink); text-decoration-thickness:3px}
.msg-swap .new{background:var(--ink); color:var(--paper); padding:4px 12px; justify-self:start}
.polaroid.tall img{aspect-ratio:4/5}
.why{display:grid; gap:2px; border-left:4px solid var(--pink); padding:4px 0 4px 12px; max-width:300px}
.why b{font-weight:800; font-size:16px}
.pg.night{background-color:var(--night); background-image:radial-gradient(rgba(239,228,214,.13) 1.1px, transparent 1.4px); color:#efe4d6}

.pg.night .h2{color:#efe4d6}

.torn{background:var(--paper); color:var(--ink); padding:18px 18px 16px; margin-top:16px; max-width:380px; position:relative; box-shadow:0 10px 18px -8px rgba(0,0,0,.6);
  clip-path:polygon(0 6px,4% 0,9% 5px,15% 1px,21% 6px,28% 0,35% 5px,42% 1px,50% 6px,57% 0,64% 5px,71% 1px,78% 6px,85% 0,92% 5px,100% 1px,100% 100%,0 100%)}

.tw.typing::after{content:"▍"; color:var(--pink); animation:blink .8s steps(2) infinite}

.conveyor li{counter-increment:cv; border:2px solid var(--ink); background:#fff; padding:10px 6px 8px; text-align:center; font-weight:700; font-size:13.5px; position:relative; animation:belt 4s ease-in-out infinite}

  const LINES = {
    hi: 'hi! flip with me →', think: 'this is how my brain works', newme: 'case file time. NEWME!',
    anjali: "meet anjali. she's the whole story", position: 'zudio too plain, urbanic too much',
    research: 'speed is their superpower', funnel: "the leak? mummy's approval", loop: 'every buyer brings the next',
    content: 'confident, not just beautiful', contact: "chai ya coffee? let's talk",
    think2: '8 steps, every single campaign', nprep: 'my real job. my fav case', nprep2: '26M+ views in six months!',
    burnt: 'hype gets the first customer', slikk: 'speed gets the download', swipe: "things I couldn't scroll past",
    midnight: '2 AM thoughts, unedited', dynaos: 'XP earned, achievements unlocked'
  };
  const ACH = { hi: 'Opened the diary', nprep2: 'Grew Instagram 2.5x organic-first', dynaos: 'Led a 9-person squad to one story', contact: 'Level complete! You read the whole diary' };
  const got = new Set(); let toastT = null;
  const toastEl = document.getElementById('toast'), toastText = document.getElementById('toastText');
  function achieve(i) {
    const k = tpls[i].dataset.tab; if (!ACH[k] || got.has(k)) return; got.add(k);
    toastText.textContent = ACH[k]; toastEl.classList.add('show'); popSound();
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }
  const TIPS = ['psst - you can drag the stickers', 'turn sound on for page swishes', 'weeks 8-13 coming soon', 'try the page corners', 'click the tabs to jump'];
  let tipN = 0, buddyTimer = null;
  const dots = tpls.map((t, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('aria-label', `Go to pages ${i * 2 + 1}-${i * 2 + 2}`);
    b.addEventListener('click', () => go(i));
    track.appendChild(b); return b;
  });
  const dotX = i => track.offsetLeft + dots[i].offsetLeft + dots[i].offsetWidth / 2;
  function say(text) {
    bubble.textContent = text;
    bubble.classList.remove('say'); void bubble.offsetWidth; bubble.classList.add('say');
  }
  function hop() { buddy.classList.remove('hop'); void buddy.offsetWidth; buddy.classList.add('hop'); }
  function placeBuddy(i, animate) {
    const x = dotX(i), fromX = buddy.offsetLeft;
    buddy.classList.toggle('right', x > track.offsetLeft + track.offsetWidth * (narrow.matches ? 0.45 : 0.62));
    if (!animate) { buddy.style.transition = 'none'; buddy.style.left = x + 'px'; void buddy.offsetWidth; buddy.style.transition = ''; return; }
    buddy.classList.toggle('face-l', x < fromX);
    buddy.classList.add('walk'); buddy.classList.remove('hop');
    buddy.style.left = x + 'px';
    clearTimeout(buddyTimer);
    buddyTimer = setTimeout(() => { buddy.classList.remove('walk', 'face-l'); hop(); say(LINES[tpls[i].dataset.tab] || 'keep flipping'); achieve(i); }, reduce.matches ? 0 : 1000);
  }
  function markDots() {
    dots.forEach((d, i) => { d.setAttribute('aria-current', String(i === cur)); if (i < cur) d.classList.add('seen'); });
  }
  const pokeBuddy = () => { hop(); popSound(); if (!cover.hidden) { openCover(); return; } say(TIPS[tipN++ % TIPS.length]); };
  buddy.addEventListener('click', pokeBuddy);
  buddy.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pokeBuddy(); } });
  addEventListener('resize', () => placeBuddy(cur, false));

  /* ---------- tabs ---------- */
  const tabStart = [];
  tpls.forEach((t, i) => {
    if (!t.dataset.label) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab'; b.textContent = t.dataset.label; b.dataset.c = t.dataset.c; b.dataset.i = i;
    b.addEventListener('click', () => go(i));
    tabsEl.appendChild(b); tabStart.push(i);
  });
  const tabFor = i => tabStart.filter(s => s <= i).pop();

  function paint(i, mode) {
    slotL.replaceChildren(half(i, 0, mode, 0));
    slotR.replaceChildren(half(i, 1, mode, 0.25));
  }
  function ui() {
    prev.disabled = cprev.disabled = cur === 0;
    next.disabled = cnext.disabled = cur === tpls.length - 1;
    count.textContent = `pages ${cur * 2 + 1}-${cur * 2 + 2} / ${tpls.length * 2}`;
    const t = tabFor(cur);
    tabsEl.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', String(+b.dataset.i === t)));
    markDots();
  }

  function go(j) {
    if (busy || j === cur || j < 0 || j >= tpls.length || !cover.hidden) return;
    const from = cur; cur = j; ui(); flipSound(); placeBuddy(j, true);
    if (reduce.matches || narrow.matches) {
      paint(j, 'enter');
      if (narrow.matches) pages.scrollIntoView({ block: 'start', behavior: reduce.matches ? 'auto' : 'smooth' });
      return;
    }
    busy = true;
    const fwd = j > from, t0 = performance.now();
    const flap = document.createElement('div');
    flap.className = 'flap ' + (fwd ? 'fwd' : 'back');
    const top = document.createElement('div'), under = document.createElement('div');
    top.className = 'face ' + (fwd ? 'face-r' : 'face-l');
    under.className = 'face under ' + (fwd ? 'face-l' : 'face-r');
    if (fwd) {
      top.appendChild(snapshot(slotR));
      under.appendChild(half(j, 0, 'enter', 0.3));
      slotR.replaceChildren(half(j, 1, 'enter', 0.35));
    } else {
      top.appendChild(snapshot(slotL));
      under.appendChild(half(j, 1, 'enter', 0.3));
      slotL.replaceChildren(half(j, 0, 'enter', 0.35));
    }
    top.firstElementChild.classList.add(fwd ? 'face-r' : 'face-l');
    under.firstElementChild.classList.add(fwd ? 'face-l' : 'face-r');
    flap.append(top, under);
    pages.appendChild(flap);
    const done = () => {
      if (!flap.isConnected) return;
      // keep the page that just landed (its animations already played on the flap)
      const landed = under.firstElementChild;
      landed.classList.remove('face-l', 'face-r');
      // re-inserting restarts CSS animations, so shift each delay back by the time already played
      const spent = (performance.now() - t0) / 1000;
      landed.querySelectorAll('[style*="--d"]').forEach(x => {
        x.style.setProperty('--d', (parseFloat(x.style.getPropertyValue('--d')) - spent).toFixed(3) + 's');
      });
      if (fwd) slotL.replaceChildren(landed); else slotR.replaceChildren(landed);
      flap.remove(); busy = false;
    };
    flap.addEventListener('animationend', e => { if (e.target === flap) done(); });
    setTimeout(done, 1200);
  }

  prev.addEventListener('click', () => go(cur - 1));
  next.addEventListener('click', () => go(cur + 1));
  cprev.addEventListener('click', () => go(cur - 1));
  cnext.addEventListener('click', () => go(cur + 1));
  addEventListener('keydown', e => {
    if (!cover.hidden && (e.key === 'Enter' || e.key === 'ArrowRight')) { openCover(); return; }
    if (e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'ArrowLeft') go(cur - 1);
  });

  /* ---------- swipe (phones) ---------- */
  let sx = null;
  pages.addEventListener('touchstart', e => { sx = e.target.closest('.drag') ? null : e.touches[0].clientX; }, { passive: true });
  pages.addEventListener('touchend', e => {
    if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1));
  });

  /* ---------- drag the stickers ---------- */
  let drag = null;
  pages.addEventListener('pointerdown', e => {
    const el = e.target.closest('.drag');
    if (!el || el.closest('.flap') || e.button > 0) return;
    const o = offsets.get(el.dataset.k) || { x: 0, y: 0 };
    drag = { el, sx: e.clientX, sy: e.clientY, ox: o.x, oy: o.y, moved: false };
    el.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    e.preventDefault();
  });
  pages.addEventListener('pointermove', e => {
    if (!drag) return;
    const x = drag.ox + e.clientX - drag.sx, y = drag.oy + e.clientY - drag.sy;
    if (Math.abs(x - drag.ox) + Math.abs(y - drag.oy) > 3) drag.moved = true;
    drag.el.style.translate = `${x}px ${y}px`;
    drag.x = x; drag.y = y;
  });
  const endDrag = () => {
    if (!drag) return;
    drag.el.classList.remove('dragging');
    if (drag.moved) { offsets.set(drag.el.dataset.k, { x: drag.x, y: drag.y }); popSound(); }
    drag = null;
  };
  pages.addEventListener('pointerup', endDrag);
  pages.addEventListener('pointercancel', endDrag);

  /* ---------- copy email ---------- */
  pages.addEventListener('click', e => {
    const b = e.target.closest('.copy'); if (!b) return;
    const ok = () => { b.textContent = 'copied'; popSound(); setTimeout(() => b.textContent = 'copy', 1600); };
    try { navigator.clipboard.writeText(b.dataset.copy).then(ok, () => selectText(b)); } catch (_) { selectText(b); }
  });
  function selectText(b) {
    const r = document.createRange(); r.selectNodeContents(b.previousElementSibling);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'selected';
  }

  /* ---------- cover ---------- */
  let opened = false;
  function openCover() {
    if (opened) return; opened = true;
    flipSound();
    cover.classList.add('opening');
    paint(cur, 'enter');
    setTimeout(() => { cover.hidden = true; hop(); say(LINES[tpls[cur].dataset.tab]); achieve(cur); }, 1050);
  }
  cover.addEventListener('click', openCover);

  /* ---------- start ---------- */
  const h = (location.hash || '').slice(1);
  cur = Math.max(0, tpls.findIndex(t => t.dataset.tab === h));
  ui();
  if (h || reduce.matches) {
    cover.hidden = true; opened = true; say(LINES[tpls[cur].dataset.tab]);
    paint(cur, 'enter');
  } else {
    paint(cur, 'still');
    setTimeout(openCover, 1400);
  }
  placeBuddy(cur, false);
  if (reduce.matches) document.querySelectorAll('svg').forEach(s => s.pauseAnimations && s.pauseAnimations());
})();

</script>
